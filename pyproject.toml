[project]
name = "mudlab"
# Source of truth for the version is src/mudlab/__init__.py __version__;
# keep this equal to it (verify_about.py fails if they drift).
version = "0.2.0"
description = "MudLab - Windows desktop application (PySide6 + NumPy/SciPy/Matplotlib)"
requires-python = ">=3.14"
dependencies = [
    "PySide6==6.11.1",
    "numpy==2.5.0",
    "scipy==1.18.0",
    "matplotlib==3.11.0",
]
